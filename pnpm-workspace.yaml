packages:
  - '.'

# Scripts nativos permitidos (pnpm supply-chain). false = omitir build sin fallar el install.
allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@parcel/watcher': false
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  protobufjs: true
  tesseract.js: true
  unrs-resolver: true
  workerd: false

overrides:
  '@fastify/busboy': '>=3.2.1'
  '@babel/core': ^7.29.6
  '@tootallnate/once': ^3.0.1
  axios: 1.20.0
  '@grpc/grpc-js': '>=1.14.5'
  body-parser: '>=2.3.0'
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  deepmerge-ts: '>=8.0.2'
  fast-uri: '>=4.1.5'
  browserslist: '>=4.28.7'
  mysql2: '>=3.22.0'
  form-data@2: 2.5.6
  form-data@4: 4.0.6
  hono: '>=4.12.25'
  '@hono/node-server': '>=1.19.10'
  http-proxy-agent: ^7.0.2
  lodash: '>=4.17.24'
  js-yaml@3: 3.15.2
  js-yaml@4: 4.3.2
  multer: '>=2.3.0'
  protobufjs: ^7.6.3
  qs: '>=6.16.0'
  teeny-request: ^9.0.0
  uuid: '>=11.1.1'
  valibot: '>=1.4.2'
  websocket-driver: '>=0.7.5'
